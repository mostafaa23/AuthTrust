[project]
name = "wily"
version = "0.1.0"
description = "Cloud-native, black-box API security scanner"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "mostafaa23" }]
license = { text = "MIT" }
keywords = [
    "security",
    "api-security",
    "vulnerability-scanner",
    "cloud-security",
    "pentesting",
    "ssrf",
    "jwt",
    "iam",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Software Development :: Testing",
]

dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "pyyaml>=6.0",
    "pydantic>=2.6",
    "requests>=2.31",
    "aiohttp>=3.9",
    "anyio>=4.3",
    "python-dotenv>=1.0",
    "jinja2>=3.1",
    "dnspython>=2.6",
    "pyjwt>=2.8",
    "cryptography>=42.0",
    "networkx>=3.2",
]

[project.optional-dependencies]
ml = ["scikit-learn>=1.4", "numpy>=1.26"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.4", "flask>=3.0"]

[project.urls]
Homepage = "https://github.com/mostafaa23/AuthTrust"
Repository = "https://github.com/mostafaa23/AuthTrust"

[project.scripts]
wily = "wily.cli.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wily"]
